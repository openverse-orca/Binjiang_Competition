# 拨杆式按钮（类似家用电闸）任务路点。
# 位姿为占位估计值：新场景加载后请先用 --dry_run 验证轨迹，
# 再按实际拨杆位置校准 r_target_b / r_quat_b；如需向下拨动，将第 3 段 z 改为降低即可。
button_type: toggle
task: "拨动拨杆式按钮"

gripper_open: -1.0
gripper_close: 2

segments:

  # 到达拨杆下方前方（并指夹爪）
  - steps: 300
    l_hold: true
    r_target_b: [0.23, 0.15, 0.10]
    r_quat_b: [-0.02, -0.03, 0.05, 0.998]
    gripper_r: close

  # 前移贴住拨杆末端
  - steps: 200
    l_hold: true
    r_target_b: [0.26, 0.15, 0.10]
    r_quat_b: [-0.02, -0.03, 0.05, 0.998]
    gripper_r: close

  # 沿竖直方向上拨拨杆（z 抬升约 0.10 m）
  - steps: 300
    l_hold: true
    r_target_b: [0.26, 0.15, 0.20]
    r_quat_b: [-0.02, -0.03, 0.05, 0.998]
    gripper_r: close

  # 保持片刻，确认拨杆到位
  - steps: 150
    l_hold: true
    r_target_b: [0.26, 0.15, 0.21]
    r_quat_b: [-0.02, -0.03, 0.05, 0.998]
    gripper_r: close

  # 撤回
  - steps: 300
    l_hold: true
    r_target_b: [0.32, 0.10, 0.24]
    r_quat_b: [-0.02, -0.03, 0.05, 0.998]
    gripper_r: close
