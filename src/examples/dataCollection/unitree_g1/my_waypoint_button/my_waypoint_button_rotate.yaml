# 旋转式按钮（旋钮）任务路点。
# 位姿为占位估计值：新场景加载后请先用 --dry_run 验证轨迹，
# 再按实际旋钮位置校准各段 r_target_b / r_quat_b，并按旋钮行程调整第 4 段的旋转角。
button_type: rotary
task: "旋转旋转式按钮"

gripper_open: -1.0
gripper_close: 2

segments:

  # 到达旋钮上方（张开夹爪）
  - steps: 300
    l_hold: true
    r_target_b: [0.25, 0.05, 0.22]
    r_quat_b: [-0.02, -0.03, 0.05, 0.998]
    gripper_r: open

  # 竖直下移套住旋钮
  - steps: 200
    l_hold: true
    r_target_b: [0.25, 0.05, 0.15]
    r_quat_b: [-0.02, -0.03, 0.05, 0.998]
    gripper_r: open

  # 闭合夹爪抓住旋钮（脚本在夹爪切换前自动插入沉降段）
  - steps: 200
    l_hold: true
    r_target_b: [0.25, 0.05, 0.15]
    r_quat_b: [-0.02, -0.03, 0.05, 0.998]
    gripper_r: close

  # 保持位置，腕部绕竖直轴旋转旋钮（quat 的 z 分量增大，约 80°）
  - steps: 300
    l_hold: true
    r_target_b: [0.25, 0.05, 0.15]
    r_quat_b: [0.0, 0.0, 0.65, 0.76]
    gripper_r: close

  # 张开夹爪松开旋钮
  - steps: 200
    l_hold: true
    r_target_b: [0.25, 0.05, 0.15]
    r_quat_b: [0.0, 0.0, 0.65, 0.76]
    gripper_r: open

  # 竖直抬离并撤回
  - steps: 300
    l_hold: true
    r_target_b: [0.32, 0.0, 0.24]
    r_quat_b: [0.0, 0.0, 0.65, 0.76]
    gripper_r: open
